OrderItemRequest:
  type: object
  required: [sku, name, quantity, unitPriceCents]
  properties:
    sku: { type: string, maxLength: 64 }
    name: { type: string, maxLength: 200 }
    quantity: { type: integer, minimum: 1, maximum: 1000 }
    unitPriceCents: { type: integer, format: int64, minimum: 0 }

CreateOrderRequest:
  type: object
  required: [items]
  properties:
    customerId:
      type: string
      format: uuid
      description: Admins only. Defaults to the caller.
    note: { type: string, maxLength: 500 }
    items:
      type: array
      minItems: 1
      maxItems: 50
      items: { $ref: '#/OrderItemRequest' }

OrderItemResponse:
  type: object
  required: [id, sku, name, quantity, unitPriceCents, lineTotalCents]
  properties:
    id: { type: string, format: uuid }
    sku: { type: string }
    name: { type: string }
    quantity: { type: integer }
    unitPriceCents: { type: integer, format: int64 }
    lineTotalCents: { type: integer, format: int64 }

OrderResponse:
  type: object
  required: [id, customerId, status, note, totalCents, items, createdAt, updatedAt]
  properties:
    id: { type: string, format: uuid }
    customerId: { type: string, format: uuid }
    status: { type: string, enum: [open, cancelled] }
    note: { type: string }
    totalCents: { type: integer, format: int64 }
    items:
      type: array
      items: { $ref: '#/OrderItemResponse' }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

OrderSummaryResponse:
  type: object
  required: [id, customerId, status, totalCents, createdAt]
  properties:
    id: { type: string, format: uuid }
    customerId: { type: string, format: uuid }
    status: { type: string, enum: [open, cancelled] }
    totalCents: { type: integer, format: int64 }
    createdAt: { type: string, format: date-time }

OrderList:
  allOf:
    - $ref: './common.yaml#/PageMeta'
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/OrderSummaryResponse' }
