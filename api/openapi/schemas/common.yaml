Problem:
  type: object
  description: RFC 9457 problem details, extended with code, requestId and errors.
  required: [type, title, status, code]
  properties:
    type: { type: string, example: about:blank }
    title: { type: string, example: Validation failed }
    status: { type: integer, example: 400 }
    code: { type: string, example: validation.failed }
    requestId: { type: string }
    errors:
      type: object
      additionalProperties: { type: string }
      example: { email: must be a valid email address }

PageMeta:
  type: object
  required: [page, pageSize, total]
  properties:
    page: { type: integer, example: 1 }
    pageSize: { type: integer, example: 20 }
    total: { type: integer, format: int64, example: 134 }

Page:
  name: page
  in: query
  schema: { type: integer, minimum: 1, default: 1 }

PageSize:
  name: pageSize
  in: query
  schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

ProblemResponse:
  description: Error
  content:
    application/problem+json:
      schema: { $ref: '#/Problem' }
